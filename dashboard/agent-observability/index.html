<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent observability</title><style>body{margin:0;background:#10131a;color:#e7edf7;font:14px system-ui;padding:24px}main{max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#191f2b;border:1px solid #2b3548;border-radius:10px;padding:16px}.metric{font-size:26px;color:#77d5ff}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #2b3548;text-align:left}.working{color:#ffd166}.completed{color:#72e3a6}.queued{color:#9aa8c1}small{color:#9aa8c1}</style><main><h1>Agent observability <small id="updated"></small></h1><div class="grid"><section class="card">Events<div class="metric" id="events">–</div></section><section class="card">Input tokens<div class="metric" id="input">–</div></section><section class="card">Output tokens<div class="metric" id="output">–</div></section></div><section class="card" style="margin-top:12px"><h2>Run graph</h2><p><small>Parent → child relationships are derived from parentAgentId. LangGraph/LangSmith links appear when adapters emit them.</small></p><table><thead><tr><th>Node</th><th>Parent</th><th>Status</th><th>Label</th><th>Tokens</th></tr></thead><tbody id="agents"></tbody></table></section></main><script>const e=(id)=>document.getElementById(id);async function refresh(){const data=await fetch('/api/events',{cache:'no-store'}).then(r=>r.json());if(data.error)throw Error(data.error);const s=data.snapshot;e('events').textContent=s.eventCount;e('input').textContent=s.tokens.input;e('output').textContent=s.tokens.output;e('updated').textContent='updated '+new Date().toLocaleTimeString();e('agents').innerHTML=s.agents.map(a=>`<tr><td>${a.agentId}</td><td>${a.parentAgentId??'—'}</td><td class="${a.status}">${a.status}</td><td>${a.label??'—'}</td><td>${(a.tokens?.input??0)+(a.tokens?.output??0)}</td></tr>`).join('')}refresh().catch(console.error);setInterval(()=>refresh().catch(console.error),2000)</script></html>
