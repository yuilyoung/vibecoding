<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent observability</title><style>body{margin:0;background:#0b1020;color:#eaf2ff;font:14px system-ui;padding:24px}main{max-width:1180px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#121a2d;border:1px solid #2a3856;border-radius:12px;padding:16px}.metric{font-size:28px;color:#69d4ff}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2a3856;text-align:left}.working{color:#ffd166}.completed{color:#74e3a5}.queued{color:#aab6ce}.failed,.blocked{color:#ff748b}svg{width:100%;height:320px;background:#0d1425;border-radius:8px}.edge{stroke:#526887;stroke-width:2}.node{fill:#263b60;stroke:#6ea9ff;stroke-width:1.5}.label{fill:#eaf2ff;font-size:12px}small{color:#9baac5}</style><main><h1>Agent observability <small id="connection">connecting…</small></h1><div class="grid"><section class="card">Events<div class="metric" id="events">–</div></section><section class="card">Input tokens<div class="metric" id="input">–</div></section><section class="card">Output tokens<div class="metric" id="output">–</div></section></div><div class="layout"><section class="card"><h2>Run graph</h2><svg id="graph" viewBox="0 0 620 320"></svg></section><section class="card"><h2>Token matrix</h2><table><thead><tr><th>Run</th><th>Agent</th><th>In</th><th>Out</th><th>Total</th></tr></thead><tbody id="matrix"></tbody></table></section></div><section class="card" style="margin-top:12px"><h2>Live agent status</h2><table><thead><tr><th>Agent</th><th>Parent</th><th>Status</th><th>Label</th><th>Trace</th></tr></thead><tbody id="agents"></tbody></table></section></main><script>const e=id=>document.getElementById(id);const escape=s=>String(s??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function draw(data){const s=data.snapshot;e('events').textContent=s.eventCount;e('input').textContent=s.tokens.input;e('output').textContent=s.tokens.output;e('matrix').innerHTML=s.matrix.map(r=>`<tr><td>${escape(r.runId)}</td><td>${escape(r.agentId)}</td><td>${r.input}</td><td>${r.output}</td><td>${r.total}</td></tr>`).join('');e('agents').innerHTML=s.agents.map(a=>`<tr><td>${escape(a.agentId)}</td><td>${escape(a.parentAgentId)}</td><td class="${escape(a.status)}">${escape(a.status)}</td><td>${escape(a.label)}</td><td>${a.metadata?.traceUrl?`<a href="${escape(a.metadata.traceUrl)}" target="_blank">trace</a>`:'—'}</td></tr>`).join('');const nodes=s.agents, pos=new Map(nodes.map((a,i)=>[a.agentId,{x:90+(i%3)*220,y:70+Math.floor(i/3)*115}])), edges=nodes.filter(a=>a.parentAgentId&&pos.has(a.parentAgentId));e('graph').innerHTML=edges.map(a=>{const p=pos.get(a.parentAgentId),q=pos.get(a.agentId);return `<line class="edge" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`}).join('')+nodes.map(a=>{const p=pos.get(a.agentId);return `<circle class="node" cx="${p.x}" cy="${p.y}" r="31"/><text class="label" x="${p.x}" y="${p.y-3}" text-anchor="middle">${escape(a.agentId)}</text><text class="label" x="${p.x}" y="${p.y+14}" text-anchor="middle">${escape(a.status)}</text>`}).join('')}const stream=new EventSource('/api/stream');stream.onopen=()=>e('connection').textContent='live SSE connected';stream.onerror=()=>e('connection').textContent='reconnecting…';stream.addEventListener('snapshot',event=>draw(JSON.parse(event.data)));</script></html>
