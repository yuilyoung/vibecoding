<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultron Control Plane</title><style>:root{color-scheme:dark}body{margin:0;background:#08111f;color:#eaf2ff;font:14px system-ui;padding:24px}main{max-width:1240px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111d31;border:1px solid #2a3d60;border-radius:12px;padding:16px}.metric{font-size:28px;color:#69d4ff;margin-top:6px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2a3d60;text-align:left}.working{color:#ffd166}.completed{color:#74e3a5}.queued{color:#aab6ce}.failed,.blocked{color:#ff748b}svg{width:100%;height:320px;background:#0b1629;border-radius:8px}.edge{stroke:#526f98;stroke-width:2}.node{fill:#263f69;stroke:#7cb4ff;stroke-width:1.5}.label{fill:#eaf2ff;font-size:12px}small{color:#9baecf}.status{font-size:17px;color:#b7cae9;margin-top:8px;overflow-wrap:anywhere}.ok{color:#74e3a5}.bad{color:#ff748b}a{color:#78c9ff}</style><main><h1>Ultron control plane <small id="connection">연결 중…</small></h1><div class="grid"><section class="card"><small>Workspace / openai-hud</small><div class="status" id="workspace">–</div></section><section class="card"><small>2D FPS project</small><div class="status" id="project">–</div></section><section class="card"><small>Input tokens</small><div class="metric" id="input">–</div></section><section class="card"><small>Output tokens</small><div class="metric" id="output">–</div></section></div><div class="layout"><section class="card"><h2>에이전트 실행 그래프</h2><small>parentAgentId → agentId</small><svg id="graph" viewBox="0 0 620 320"></svg></section><section class="card"><h2>실행별 토큰 매트릭</h2><table><thead><tr><th>Run</th><th>Agent</th><th>In</th><th>Out</th><th>Total</th></tr></thead><tbody id="matrix"></tbody></table></section></div><section class="card" style="margin-top:12px"><h2>실시간 에이전트 상태 <small id="events"></small></h2><table><thead><tr><th>Agent</th><th>Parent</th><th>Status</th><th>Label</th><th>Source</th><th>Trace</th></tr></thead><tbody id="agents"></tbody></table></section></main><script>const e=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function dashboard(d){const w=d.workspace||{},p=d.project||{};e('workspace').innerHTML=`<span class="${w.contract==='AGENTS.md present'?'ok':'bad'}">${esc(w.status||w.contract||'unknown')}</span><br><small>${esc(w.runtimeBaseline||w.ctx||'')}</small>`;e('project').innerHTML=`<span class="${p.status==='unavailable'?'bad':'ok'}">${esc(p.status||'unknown')}</span><br><small>${esc(p.stage||p.readiness||p.ctx||'')}</small>`}function draw(data){const s=data.snapshot;e('events').textContent=`${s.eventCount} events`;e('input').textContent=s.tokens.input;e('output').textContent=s.tokens.output;dashboard(data.dashboard||{});e('matrix').innerHTML=s.matrix.map(r=>`<tr><td>${esc(r.runId)}</td><td>${esc(r.agentId)}</td><td>${r.input}</td><td>${r.output}</td><td>${r.total}</td></tr>`).join('');e('agents').innerHTML=s.agents.map(a=>`<tr><td>${esc(a.agentId)}</td><td>${esc(a.parentAgentId)}</td><td class="${esc(a.status)}">${esc(a.status)}</td><td>${esc(a.label)}</td><td>${esc(a.source)}</td><td>${a.metadata?.traceUrl?`<a href="${esc(a.metadata.traceUrl)}" target="_blank" rel="noreferrer">trace</a>`:'—'}</td></tr>`).join('');const nodes=s.agents,pos=new Map(nodes.map((a,i)=>[a.agentId,{x:90+(i%3)*220,y:70+Math.floor(i/3)*115}])),edges=nodes.filter(a=>a.parentAgentId&&pos.has(a.parentAgentId));e('graph').innerHTML=edges.map(a=>{const p=pos.get(a.parentAgentId),q=pos.get(a.agentId);return `<line class="edge" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`}).join('')+nodes.map(a=>{const p=pos.get(a.agentId);return `<circle class="node" cx="${p.x}" cy="${p.y}" r="31"/><text class="label" x="${p.x}" y="${p.y-3}" text-anchor="middle">${esc(a.agentId)}</text><text class="label" x="${p.x}" y="${p.y+14}" text-anchor="middle">${esc(a.status)}</text>`}).join('')}const stream=new EventSource('/api/stream');stream.onopen=()=>e('connection').textContent='SSE live';stream.onerror=()=>e('connection').textContent='재연결 중…';stream.addEventListener('snapshot',event=>draw(JSON.parse(event.data)));</script></html>
