# Trusted local-project defaults. Restart or open a new Codex session after changing this file.
approval_policy = "never"
default_permissions = "ai-project-workspace"

[permissions.ai-project-workspace]
description = "Write access limited to the ai-project workspace and system temp paths."
extends = ":workspace"

[permissions.ai-project-workspace.workspace_roots]
"C:/Users/yuiy/Documents/Dev/ai-project" = true

[windows]
sandbox = "elevated"

[agents]
max_concurrent_threads_per_session = 2