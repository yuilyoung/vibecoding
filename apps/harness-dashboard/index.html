<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Control Plane</title>
  <style>body{font:16px system-ui;margin:0;background:#10131a;color:#eaf0f7}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:baseline}section{background:#18202b;padding:18px;border-radius:10px;margin:16px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #2f3d4d}.ok{color:#71e39b}.fail{color:#ff8c8c}.muted{color:#aab8c7}</style>

<body><main>
  <header><div><h1>AI Project Harness</h1><p class="muted">All discoverable projects under <code>work/</code></p></div><span id="freshness" class="muted">connecting?</span></header>
  <section><h2>Projects (<code>work/</code>)</h2><div id="projects"></div></section>
  <section><h2>Runs</h2><div id="runs"></div></section>
  <section><h2>Source freshness</h2><div id="sources"></div></section>

</main><script type="module" src="/dashboard-client.mjs"></script></body>
